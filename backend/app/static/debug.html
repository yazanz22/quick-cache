<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nas backend debug</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#667085; --line:#e4e7ec;
          --served:#16a34a; --hardship:#eab308; --left_out:#dc2626; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 16px; background:#111827; color:#fff; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { font-size:16px; } header span { color:#9ca3af; font-size:12px; }
  main { display:grid; grid-template-columns: 340px 1fr 380px; gap:12px; padding:12px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); }
  label { display:block; font-size:12px; color:var(--mute); margin-top:8px; }
  select, textarea, input, button { font:inherit; width:100%; }
  select, input, textarea { padding:6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  textarea { font:12px/1.35 ui-monospace, Consolas, monospace; height:180px; }
  button { margin-top:8px; padding:7px 10px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button.alt { background:#475467; } button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { padding:3px 4px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  .up { color:var(--left_out); } .down { color:var(--served); }
  svg { width:100%; height:auto; background:#eef2f7; border-radius:8px; display:block; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin-right:10px; font-size:12px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; font-size:13px; }
  .voice { direction:rtl; background:#f0f9ff; border-radius:10px; padding:8px 10px; margin:6px 0; font-size:15px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#eef2f7; margin:1px; }
  .src-ai { background:#dbeafe; } .src-fallback { background:#fef3c7; }
  .muted { color:var(--mute); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:11px; max-height:240px; overflow:auto; background:#f9fafb; padding:6px; border-radius:6px; }
  [dir=rtl] { text-align:right; }
</style>
</head>
<body>
<header><b>Nas: backend debug page</b><span>Synthetic population, demo data, not real people. The real UI lives in frontend/.</span></header>
<main>
  <section>
    <h3>Policy</h3>
    <div class="row">
      <div><label>Baseline</label><select id="baseSel"></select></div>
      <div><label>Scenario</label><select id="scenSel"></select></div>
    </div>
    <label>Scenario policy JSON (editable)</label>
    <textarea id="policyJson"></textarea>
    <button id="btnCompare">Compare</button>
    <label>Describe a policy in your own words (AI parse)</label>
    <input id="parseText" placeholder="اسكروا المكتب يوم الخميس">
    <button id="btnParse" class="alt">Parse</button>
    <div id="parseOut"></div>
    <h3 style="margin-top:14px">Assumptions</h3>
    <div id="assumptions" class="muted" style="overflow-x:auto"></div>
  </section>

  <section>
    <h3>Map <span class="muted" id="mapNote"></span></h3>
    <div class="legend">
      <span><i class="dot" style="background:var(--served)"></i>served</span>
      <span><i class="dot" style="background:var(--hardship)"></i>hardship</span>
      <span><i class="dot" style="background:var(--left_out)"></i>left out</span>
      <span><i class="dot" style="border:2px solid #000;background:#fff"></i>got worse</span>
      <label style="display:inline;margin-left:10px"><input type="checkbox" id="showBase" style="width:auto"> show baseline</label>
    </div>
    <svg id="map" viewBox="0 0 800 560"></svg>
    <div id="citizen"></div>
  </section>

  <section>
    <h3>Impact</h3>
    <div id="kpis" class="muted">Pick a scenario and press Compare.</div>
    <div id="groups"></div>
    <div class="row">
      <button id="btnFixgrid">Engine fixes</button>
      <button id="btnFixes" class="alt">+ AI explain</button>
    </div>
    <div id="fixes"></div>
    <div class="row">
      <button id="btnSens" class="alt">Robustness</button>
      <button id="btnReport" class="alt">Report</button>
    </div>
    <div id="sens"></div>
    <div id="report"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let POP = [], SITES = [], AREAS = [], SCEN = {}, LABELS = null, CMP = null, FIXES = [];

async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(path + " " + r.status + ": " + (await r.text()).slice(0, 300));
  return r.json();
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; }
}
function basePolicy() { return SCEN[$("baseSel").value].policy; }
function scenPolicy() { return JSON.parse($("policyJson").value); }

// --- map projection
const BOUNDS = {latMin: 31.90, latMax: 32.06, lngMin: 35.79, lngMax: 36.03};
const px = (lat, lng) => [ (lng - BOUNDS.lngMin) / (BOUNDS.lngMax - BOUNDS.lngMin) * 800,
                           560 - (lat - BOUNDS.latMin) / (BOUNDS.latMax - BOUNDS.latMin) * 560 ];
function drawMap() {
  const svg = $("map"); const showBase = $("showBase").checked;
  const res = CMP ? (showBase ? CMP.baseline : CMP.scenario).outcomes : null;
  const worse = new Set(CMP ? CMP.flipped_worse : []);
  const usedSites = new Set(scenPolicy().offices.map(o => o.site_id));
  let h = "";
  for (const a of AREAS) { const [x, y] = px(a.lat, a.lng);
    h += `<text x="${x}" y="${y - 34}" text-anchor="middle" font-size="12" fill="#475467">${esc(a.name_en)}</text>`; }
  POP.forEach((c, i) => { const [x, y] = px(c.lat, c.lng);
    const st = res ? res[i].status : "none";
    const col = {served:"var(--served)", hardship:"var(--hardship)", left_out:"var(--left_out)", none:"#98a2b3"}[st];
    const ring = !showBase && worse.has(c.id) ? 'stroke="#000" stroke-width="1.2"' : "";
    h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${col}" ${ring} data-i="${i}" style="cursor:pointer"/>`; });
  for (const s of SITES) { const [x, y] = px(s.lat, s.lng); const on = usedSites.has(s.id);
    h += `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" fill="${on ? "#1d4ed8" : "none"}" stroke="#1d4ed8" stroke-width="2"><title>${esc(s.name_en)}</title></rect>`; }
  for (const m of scenPolicy().mobile_units || []) { const a = AREAS.find(x => x.id === m.area); const [x, y] = px(a.lat, a.lng);
    h += `<polygon points="${x},${y - 9} ${x + 8},${y + 6} ${x - 8},${y + 6}" fill="#7c3aed"><title>van ${m.day} ${m.open}-${m.close}</title></polygon>`; }
  svg.innerHTML = h;
  $("mapNote").textContent = CMP ? (showBase ? "(baseline)" : "(scenario)") : "";
}
$("map").addEventListener("click", e => { const i = e.target.dataset?.i; if (i !== undefined) showCitizen(+i); });
$("showBase").addEventListener("change", drawMap);

async function showCitizen(i) {
  const c = POP[i]; const o = CMP ? ($("showBase").checked ? CMP.baseline : CMP.scenario).outcomes[i] : null;
  const L = k => LABELS.reasons[k]?.en ?? k;
  let h = `<div class="card"><b>${esc(c.name_en)} · ${esc(c.name_ar)}</b> (${c.id}) · ${c.age}${c.gender} · ${esc(c.area)}<br>
    <span class="muted">${c.mobility} · car ${c.has_car ? "yes" : "no"} · smartphone ${c.has_smartphone ? "yes" : "no"} · literacy ${c.digital_literacy}
    · ${c.works ? "works " + c.work_start + "-" + c.work_end : "not working"} · ${c.income_band} income · helper: ${esc(c.helper_relation_en || "none")}</span><br>
    ${c.tags.map(t => `<span class="tag">${t}</span>`).join("")}`;
  if (o) {
    h += `<p><b style="color:var(--${o.status})">${o.status}</b> via ${esc(o.channel_name_en || "-")} · ${o.mode || "-"} ${o.visit_day ? "· " + o.visit_day : ""}
      · ${o.travel_minutes} min one-way · ${o.cost_jd} JD · ${o.hours_lost} h lost ${o.work_hours_missed ? "· " + o.work_hours_missed + " h work missed" : ""}
      ${o.bus_transfers ? "· " + o.bus_transfers + " transfer(s)" : ""}<br>${o.reasons.map(r => `<span class="tag">${esc(L(r))}</span>`).join("")}</p>
      <div id="voiceBox" class="muted">loading voice…</div>`;
  }
  $("citizen").innerHTML = h + "</div>";
  if (o) {
    try { const v = await api("/citizen/voice", {citizen_id: c.id, outcome: o});
      $("voiceBox").innerHTML = `<div class="voice">${esc(v.text_ar)}</div><span class="muted">${esc(v.summary_en)}</span>
        <span class="tag src-${v.source}">${v.source === "ai" ? "AI voice" : "template"}</span>`;
    } catch (e) { $("voiceBox").textContent = e.message; }
  }
}

function fmtDelta(d, invert) { if (!d) return "0"; const up = d > 0; const bad = invert ? !up : up;
  return `<span class="${bad ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(d).toFixed(1)}</span>`; }
function renderCompare() {
  const b = CMP.baseline.kpis, s = CMP.scenario.kpis, d = CMP.kpi_delta;
  const rows = [["Served %", "pct_served", true], ["Hardship %", "pct_hardship"], ["Left out %", "pct_left_out"],
                ["Avg hours lost", "avg_hours_lost"], ["Avg cost JD", "avg_cost_jd"]];
  $("kpis").innerHTML = `<table><tr><th></th><th>baseline</th><th>scenario</th><th>Δ</th></tr>` +
    rows.map(([n, k, inv]) => `<tr><td>${n}</td><td>${b[k]}</td><td>${s[k]}</td><td>${fmtDelta(d[k], inv)}</td></tr>`).join("") +
    `</table><p class="muted">${CMP.flipped_worse.length} citizens got worse, ${CMP.flipped_better.length} better. Worst groups: <b>${CMP.worst_groups.slice(0, 2).join(", ")}</b></p>`;
  const G = ["all", "elderly", "disabled", "no_car", "offline", "low_income", "worker"];
  $("groups").innerHTML = `<table><tr><th>group</th><th>n</th><th>served</th><th>hardship</th><th>left out</th></tr>` +
    G.map(g => { const x = CMP.scenario.by_group[g], y = CMP.baseline.by_group[g];
      return `<tr><td>${g}</td><td>${x.n}</td><td>${x.served}</td><td>${x.hardship} ${fmtDelta(x.hardship - y.hardship)}</td><td>${x.left_out} ${fmtDelta(x.left_out - y.left_out)}</td></tr>`; }).join("") + `</table>`;
}
async function runCompare() {
  CMP = await api("/compare", {baseline: basePolicy(), scenario: scenPolicy()});
  renderCompare(); drawMap(); $("fixes").innerHTML = ""; $("sens").innerHTML = ""; $("report").innerHTML = "";
}

function renderFixes(list, note) {
  FIXES = list;
  $("fixes").innerHTML = list.map((f, i) => `<div class="card"><b>${esc(f.title_en)}</b><br>
    <span class="tag ${f.source === "ai_proposed" ? "src-ai" : ""}">${f.source === "ai_proposed" ? "AI-proposed · verified" : "Engine-searched · verified"}</span>
    left out −${f.left_out_drop} pts · hardship −${f.hardship_drop} pts
    ${f.explanation_en ? `<div class="muted">${esc(f.explanation_en)}</div><div dir="rtl" class="muted">${esc(f.explanation_ar)}</div>` : ""}
    <button class="alt" onclick="applyFix(${i})">Apply</button></div>`).join("") +
    (note ? `<p class="muted">AI proposal: <b>${esc(note.status)}</b> ${note.title_en ? "(" + esc(note.title_en) + ")" : ""}
      ${note.left_out_drop !== undefined ? `· its result −${note.left_out_drop}/−${note.hardship_drop} vs best grid −${note.best_grid_left_out_drop}/−${note.best_grid_hardship_drop}` : ""}</p>` : "");
}
window.applyFix = i => { $("policyJson").value = JSON.stringify(FIXES[i].policy, null, 1); runCompare(); };

async function init() {
  [POP, SITES, AREAS, LABELS] = await Promise.all([api("/population"), api("/sites"), api("/areas"), api("/labels")]);
  const sc = await api("/scenarios"); sc.forEach(s => SCEN[s.id] = s);
  for (const sel of ["baseSel", "scenSel"]) $(sel).innerHTML = sc.map(s => `<option value="${s.id}">${esc(s.name_en)}</option>`).join("");
  $("baseSel").value = "baseline"; $("scenSel").value = "abdali_digital_first";
  $("policyJson").value = JSON.stringify(SCEN.abdali_digital_first.policy, null, 1);
  $("scenSel").onchange = () => { $("policyJson").value = JSON.stringify(SCEN[$("scenSel").value].policy, null, 1); runCompare(); };
  $("baseSel").onchange = runCompare;
  const A = await api("/assumptions");
  $("assumptions").innerHTML = `<table>${A.map(a => `<tr title="${esc(a.rationale)}"><td>${a.name}${a.perturbed_in_robustness_check ? " ±" : ""}</td>
    <td>${esc(typeof a.value === "object" ? JSON.stringify(a.value) : a.value)} ${esc(a.unit)}</td><td><span class="tag">${a.tag}</span></td></tr>`).join("")}</table>`;
  drawMap(); await runCompare();
}

$("btnCompare").onclick = e => busy(e.target, runCompare);
$("btnFixgrid").onclick = e => busy(e.target, async () => renderFixes(await api("/fixgrid", {baseline: basePolicy(), scenario: scenPolicy()})));
$("btnFixes").onclick = e => busy(e.target, async () => { const r = await api("/fixes", {baseline: basePolicy(), scenario: scenPolicy()});
  renderFixes(r.fixes, r.ai_proposal); });
$("btnSens").onclick = e => busy(e.target, async () => {
  if (!FIXES.length) renderFixes(await api("/fixgrid", {baseline: basePolicy(), scenario: scenPolicy()}));
  if (!FIXES.length) { $("sens").innerHTML = `<p class="muted">No fix to test.</p>`; return; }
  const s = await api("/sensitivity", {baseline: basePolicy(), scenario: scenPolicy(), fix: FIXES[0].policy});
  $("sens").innerHTML = `<div class="card"><b>${s.passed ? "Ranking held" : "Partly held"}: ${s.ranking_held}/${s.runs}</b> at ±20%, fix still helps ${s.fix_still_helps}/${s.runs}.
    ${s.stable_top2 ? `Top-2 groups always <b>${s.stable_top2.join(" & ")}</b> (order may flip).` : ""} ${s.stable_top_group ? "Stable top group: <b>" + s.stable_top_group + "</b>" : ""}
    <pre>${esc(s.details.map(d => `${d.param} ×${d.factor}: ${d.top2.join(", ")}${d.ranking_held === false ? "  ← flipped" : ""}`).join("\n"))}</pre></div>`;
});
$("btnReport").onclick = e => busy(e.target, async () => {
  const r = await api("/report", {compare_result: CMP, sensitivity: null});
  $("report").innerHTML = `<div class="card"><span class="tag src-${r.source}">${r.source}</span><div dir="rtl">${esc(r.summary_ar)}</div><p>${esc(r.summary_en)}</p></div>`;
});
$("btnParse").onclick = e => busy(e.target, async () => {
  const r = await api("/policy/parse", {text: $("parseText").value, current_policy: scenPolicy(), lang: "ar"});
  if (r.status === "ok") {
    $("parseOut").innerHTML = `<div class="card"><b>Understood as</b> <span class="tag src-${r.source}">${r.source}</span>
      <ul>${r.changes_en.map(x => `<li>${esc(x)}</li>`).join("")}</ul><ul dir="rtl">${r.changes_ar.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <button id="btnApply">Apply</button></div>`;
    $("btnApply").onclick = () => { $("policyJson").value = JSON.stringify(r.policy, null, 1); $("parseOut").innerHTML = ""; runCompare(); };
  } else {
    $("parseOut").innerHTML = `<div class="card"><b>Not supported</b> <span class="tag src-${r.source}">${r.source}</span>
      <p>${esc(r.message_en)}</p><p dir="rtl">${esc(r.message_ar)}</p></div>`;
  }
});
init().catch(e => { $("kpis").textContent = "Backend error: " + e.message; });
</script>
</body>
</html>
